name: Create LIVE version notification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current website version
        id: version
        run: |
          VERSION=$(grep -oE "const SITE_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" app.js | head -1 | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/")

          if [ -z "$VERSION" ]; then
            echo "Could not find SITE_VERSION in app.js"
            exit 1
          fi

          echo "Current version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Only continue for the final 1.3.0 release
        id: release_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$VERSION" = "1.3.0" ]; then
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE notification is intentionally disabled until SITE_VERSION is 1.3.0."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether website version changed
        id: version_check
        if: steps.release_check.outputs.release_ready == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_VERSION=$(grep -oE "const SITE_VERSION = '[0-9]+\.[0-9]+\.[0-9]+" app.js | head -1 | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+).*/\1/")
          PREVIOUS_VERSION=$(git show HEAD^:app.js 2>/dev/null | grep -oE "const SITE_VERSION = '[0-9]+\.[0-9]+\.[0-9]+" | head -1 | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+).*/\1/")

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"

          if [ -n "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version did not change."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create LIVE notification for 1.3.0
        if: steps.release_check.outputs.release_ready == 'true' && steps.version_check.outputs.version_changed == 'true'
        env:
          SUPABASE_URL: https://mgxbsxqgjxpdvdjsixqi.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Creating LIVE website-update notification for version $VERSION..."

          curl --fail-with-body \
            --http1.1 \
            --retry 3 \
            --retry-all-errors \
            -X POST \
            "$SUPABASE_URL/rest/v1/site_notifications" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data "$(jq -n \
              --arg version "$VERSION" \
              --arg title "Website updated" \
              --arg message "A new version of the DGSL Site Register is available. Please refresh the website to load the latest version." \
              '{version:$version,title:$title,message:$message}')"

          echo "LIVE 1.3.0 notification created successfully."
